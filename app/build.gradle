apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

// Huawei Ads (Petal) slot IDs for the AppGallery build: -PHMS_BANNER_ID=... or a gitignored ads.properties.
// Until the real slots are set the hms build falls back to Huawei's public test slots.
def hmsAdsProps = new Properties()
def hmsAdsFile = rootProject.file('ads.properties')
if (hmsAdsFile.exists()) hmsAdsFile.withInputStream { hmsAdsProps.load(it) }
def hmsAdId = { String key, String fallback -> ((project.findProperty(key) ?: hmsAdsProps.getProperty(key))?.toString()?.trim()) ?: fallback }
def HMS_TEST_BANNER_ID = 'testw6vs28auh3'
def HMS_TEST_INTERSTITIAL_ID = 'testb4znbuh3n2'
def HMS_BANNER_ID = hmsAdId('HMS_BANNER_ID', 'e8cm36apiv')
def HMS_INTERSTITIAL_ID = hmsAdId('HMS_INTERSTITIAL_ID', 'r6ptj0cv84')


android {
    namespace 'com.dotsandboxes'
    compileSdk 36

    defaultConfig {
        applicationId "com.bumbumapps.dotsandboxespro"
        minSdk 24
        targetSdk 36
        versionCode 12
        versionName "2.0.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
        resValues true
    }

    // play = Google Play (AdMob + UMP), hms = Huawei AppGallery (Huawei Ads, no Google Mobile Services).
    flavorDimensions = ['store']
    productFlavors {
        play {
            dimension 'store'
        }
        hms {
            dimension 'store'
            resValue 'string', 'hms_banner_id', HMS_BANNER_ID
            resValue 'string', 'hms_interstitial_id', HMS_INTERSTITIAL_ID
            resValue 'string', 'hms_test_banner_id', HMS_TEST_BANNER_ID
            resValue 'string', 'hms_test_interstitial_id', HMS_TEST_INTERSTITIAL_ID
        }
    }

    buildTypes {
        debug {
            // Google's public test IDs so debug builds never request real ads.
            resValue 'string', 'ad_mob_id', 'ca-app-pub-3940256099942544~3347511713'
            resValue 'string', 'banner_id', 'ca-app-pub-3940256099942544/9214589741'
            resValue 'string', 'interstitial_id', 'ca-app-pub-3940256099942544/1033173712'
        }
        release {
            // Real AdMob IDs (AdMob app "Dots and Boxes").
            resValue 'string', 'ad_mob_id', 'ca-app-pub-8444865753152507~7746356368'
            resValue 'string', 'banner_id', 'ca-app-pub-8444865753152507/2507521522'
            resValue 'string', 'interstitial_id', 'ca-app-pub-8444865753152507/8130511156'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.media:media:1.7.1'
    implementation "androidx.constraintlayout:constraintlayout:$constraintlayout"
    implementation "androidx.preference:preference:$preference"
    implementation "androidx.cardview:cardview:$cardview"
    implementation "androidx.recyclerview:recyclerview:$recyclerview"
    implementation 'com.google.android.material:material:1.13.0'

    // RxJava
    implementation 'io.reactivex:rxjava:1.3.8'
    implementation 'io.reactivex:rxandroid:1.2.1'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Room database
    implementation "androidx.room:room-runtime:$room"
    annotationProcessor "androidx.room:room-compiler:$room"

    // sdp and ssp
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation 'com.intuit.ssp:ssp-android:1.0.6'

    // butterknife
    implementation 'com.jakewharton:butterknife:10.2.3'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'

    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'com.google.code.gson:gson:2.13.1'

    // animation
    implementation 'com.eftimoff:androidplayer:1.0.3@aar'
    implementation 'com.nineoldandroids:library:2.4.0'

    // ads + consent
    playImplementation 'com.google.android.gms:play-services-ads:25.5.0'
    playImplementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    hmsImplementation 'com.huawei.hms:ads-lite:13.4.91.301'

    // loader
    implementation('com.tuyenmonkey:mkloader:1.4.0') {
        // Its classes do not use the old support library (checked); AndroidX already provides it.
        exclude group: 'com.android.support'
    }

    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
